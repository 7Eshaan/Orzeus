packages:
  - apps/*
  - services/*
  - packages/*

# Strict, reproducible installs.
nodeLinker: isolated
strictPeerDependencies: true
engineStrict: true
minimumReleaseAgeExclude:
  - "@tauri-apps/cli-darwin-arm64@2.12.6"
  - "@tauri-apps/cli-darwin-x64@2.12.6"
  - "@tauri-apps/cli-linux-arm-gnueabihf@2.12.6"
  - "@tauri-apps/cli-linux-arm64-gnu@2.12.6"
  - "@tauri-apps/cli-linux-arm64-musl@2.12.6"
  - "@tauri-apps/cli-linux-riscv64-gnu@2.12.6"
  - "@tauri-apps/cli-linux-x64-gnu@2.12.6"
  - "@tauri-apps/cli-linux-x64-musl@2.12.6"
  - "@tauri-apps/cli-win32-arm64-msvc@2.12.6"
  - "@tauri-apps/cli-win32-ia32-msvc@2.12.6"
  - "@tauri-apps/cli-win32-x64-msvc@2.12.6"
  - "@tauri-apps/cli@2.12.6"
  - "@vitest/mocker@5.1.1"
  - "@vitest/spy@5.1.1"
  - fast-check@4.10.3
  - vitest@5.1.1

# Grammar packages are used only for their prebuilt .wasm files (see packages/context);
# their native install scripts must never run.
allowBuilds:
  # esbuild's postinstall only double-checks its platform binary, which pnpm installs anyway.
  esbuild: false
  tree-sitter-javascript: false
  tree-sitter-python: false
  tree-sitter-typescript: false
